<title>Gull-Shadow · Day / Night · Soft Display Floor</title>
<style>

#app,canvas{width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#tl{position:absolute;left:22px;top:18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.6)}
#tl b{display:block;font-size:17px;letter-spacing:.02em;text-transform:none;margin-bottom:3px;font-weight:600}
#bottom{position:absolute;left:22px;right:22px;bottom:20px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}

#stage{font-size:15px;font-weight:600;color:#8ff6ff;margin-bottom:4px}
#cap{font-size:13.5px;line-height:1.45;opacity:.95}
#right{text-align:right;font-size:11.5px;opacity:.85;line-height:1.6;text-shadow:0 1px 6px rgba(0,0,0,.7)}
#dots{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;pointer-events:auto}
#dots span{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid rgba(143,246,255,.5);cursor:pointer;background:rgba(5,16,40,.4)}
#dots span.on{background:#5ff2ff;color:#06203a;border-color:#5ff2ff;font-weight:700}
#rec{position:absolute;right:22px;top:18px;font-size:11px;letter-spacing:.14em;opacity:.8;display:flex;align-items:center;gap:7px}

#loading{position:fixed;inset:0;display:grid;place-items:center;background:#06122e;font-size:13px;letter-spacing:.1em}
