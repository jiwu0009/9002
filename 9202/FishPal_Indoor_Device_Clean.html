<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Animation revision: 2026-10-28. Reference: supplied FishMarket_Interactive_3D (2).html. Architecture: photo-informed approximation; interactive devices/screens are proposals. -->
<title>FishPal · Indoor & Device Detail</title>
<style>
:root{--ink:#243d3d;--muted:#7d8985;--line:#d9ddd6;--paper:#f8f8f3;--green:#336d69;--soft:#e4eeea}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button{font:inherit;cursor:pointer;color:inherit;transition:background .17s,color .17s;border:0}button:focus-visible{outline:2px solid var(--green);outline-offset:3px}button:disabled{opacity:.32;cursor:default}
#app{height:100dvh;display:grid;grid-template-rows:76px minmax(0,1fr) 118px}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:0 30px;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{display:flex;gap:14px;align-items:center}.brand svg{width:37px;height:37px;stroke:#426d68;fill:none;stroke-width:1.6}.brand h1{font-family:Georgia,serif;font-size:23px;font-weight:400;letter-spacing:-.6px;margin:0}.brand p{margin:5px 0 0;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.scene-tabs{display:flex;gap:7px}.scene-tab{background:transparent;padding:11px 18px;border-radius:6px;font-size:12px;color:#73827c;white-space:nowrap}.scene-tab.selected{background:var(--ink);color:#fff}.scene-tab span{margin-right:7px;opacity:.58;font-size:10px}
main{position:relative;min-height:0;overflow:hidden}#viewport{height:100%;width:100%;cursor:grab}#viewport:active{cursor:grabbing}canvas{display:block;outline:0;width:100%;height:100%;touch-action:none}
footer{display:grid;grid-template-rows:68px 50px;background:var(--paper);border-top:1px solid var(--line);padding:0 26px}
.controls-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.steps{display:flex;gap:5px;align-items:center}.steps button{background:transparent;border-radius:5px;padding:10px 13px;font-size:12px;white-space:nowrap;color:#657974}.steps button:hover{background:#ebeee7}.steps button.selected{background:var(--soft);color:#295f5a;box-shadow:inset 0 -2px 0 #527c72}
.tools{display:flex;gap:4px;align-items:center;border-left:1px solid var(--line);padding-left:16px}.tool{display:flex;align-items:center;justify-content:center;background:transparent;width:34px;height:34px;border-radius:5px;color:#71817b}.tool:hover,.tool.is-active{background:var(--soft);color:#285b53}.tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.details-row{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;border-top:1px solid var(--line);padding-top:13px}.details-row p{margin:0;font-size:11px;line-height:1.4;color:#657771}#caption{max-width:790px}.help{white-space:nowrap;text-align:right;color:#8a9690!important;font-size:10px!important}.help small{display:block;font-size:9px;color:#9aa39d;margin-top:3px}
#loading,#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:#eeeee8;color:#5f7871;font-size:12px;z-index:1}#loading i{width:32px;height:32px;border:2px solid #d5dfd8;border-top-color:#527970;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#fallback p{max-width:410px;line-height:1.6;text-align:center}
@media(max-width:850px){header{padding:0 17px}.brand h1{font-size:20px}.brand p{font-size:8px}.scene-tab{padding:10px 12px;font-size:11px}footer{padding:0 14px}.steps button{padding:10px 8px;font-size:11px}.tools{padding-left:8px;gap:0}.tool{width:30px}.help{display:none}.details-row p{font-size:10px}}
@media(max-width:590px){#app{grid-template-rows:98px minmax(0,1fr) 152px}header{flex-wrap:wrap;gap:7px;align-content:center}.brand svg{width:27px;height:27px}.brand h1{font-size:19px}.brand p{display:none}.scene-tabs{margin-left:auto}.scene-tab{padding:9px}.scene-tab span{display:none}footer{grid-template-rows:98px 54px}.controls-row{flex-wrap:wrap;gap:0;padding:10px 0}.steps{width:100%;justify-content:center;gap:0}.tools{border:0;margin:auto;padding:0}.steps button{font-size:10px;padding:9px 8px}.details-row{padding-top:9px}.details-row p{font-size:10px}.tool{width:38px}}

/* Visual refinement: same controls and information hierarchy as the source. */
:root{--ink:#354e60;--muted:#869aa5;--line:#dbe6e8;--paper:#f4f8f7;--green:#5a91a4;--soft:#e3f0f3}
:root[data-palette="sun"]{--ink:#4b5f66;--muted:#929b94;--line:#e3e6dc;--paper:#faf8f0;--green:#769795;--soft:#edf0e2}
header,footer{transition:background .5s,border-color .5s}.brand svg{stroke:#78a9b9}.brand h1{color:var(--ink);letter-spacing:-.8px}.brand p{letter-spacing:2.2px;font-size:9px}
.scene-tab.selected{background:#57798a;box-shadow:0 3px 10px #658e9a18}.scene-tab{border-radius:20px}.steps button.selected{box-shadow:inset 0 -2px 0 #82afbe;color:#3e6e80}.tool:hover,.tool.is-active{color:#548c9e}
#loading,#fallback{background:#edf4f4;color:#668a9a}#loading i{border-color:#d6e7eb;border-top-color:#7baeba}

#pixel-panel{position:absolute;right:18px;top:18px;width:256px;z-index:2;background:#f1f7f5ee;border:1px solid #cadce1;border-radius:12px;padding:10px;box-shadow:0 8px 30px #35526118;backdrop-filter:blur(8px)}
#pixel-panel[data-detail="true"]{width:336px;top:24px;right:24px}
.pixel-heading{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1.5px;margin-bottom:8px;color:#4a738c}.pixel-heading span:last-child{letter-spacing:.2px;color:#71959d}
#fishpal-pixel{width:100%;height:auto;aspect-ratio:4/3;image-rendering:pixelated;image-rendering:crisp-edges;border:4px solid #4a738c;border-radius:5px;cursor:pointer;touch-action:manipulation}
#pixel-stations{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}#pixel-stations button{padding:6px 7px;background:#e0ecec;color:#426779;border-radius:4px;font-size:9px;flex:1}#pixel-stations button.active{background:#4a738c;color:white}
.pixel-actions{display:flex;gap:4px;margin-top:5px}.pixel-actions button{flex:1;padding:7px 3px;font-size:10px;background:#e0ecec;border-radius:4px}.pixel-actions button[data-action="group"]{background:#f1d7bf}#pixel-announce{font-size:10px;color:#607f8d;margin-top:7px;min-height:12px}
@media(max-width:850px){#pixel-panel,#pixel-panel[data-detail="true"]{width:200px;right:10px;top:10px;padding:7px}.pixel-heading{font-size:8px}#pixel-stations button{font-size:8px;padding:5px 4px}}
@media(max-width:590px){#pixel-panel,#pixel-panel[data-detail="true"]{width:168px;right:8px;top:8px}#pixel-announce{font-size:8px}.pixel-actions button{font-size:8px}}

/* Two focused views; no header, footer, step bar or outdoor navigation. */
#app{display:block;height:100dvh}main{height:100%;width:100%}
#view-switch{position:absolute;left:24px;top:22px;padding:9px 12px;background:#f4f8f7de;color:#4a738c;border-radius:20px;font-size:12px;z-index:3}
#start-flow{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:13px 38px;border-radius:28px;background:#4a738c;color:#fff;font-size:15px;letter-spacing:2px;box-shadow:0 5px 20px #354e6026;z-index:3}
#start-flow:hover{background:#365b72}#pixel-panel{display:none}#pixel-panel[data-detail="true"]{display:block;width:336px;right:28px;top:50%;transform:translateY(-50%)}
@media(max-width:850px){#pixel-panel[data-detail="true"]{width:240px;right:18px}#view-switch{left:14px;top:14px}}
@media(max-width:590px){#pixel-panel[data-detail="true"]{width:200px;right:12px;top:48%}#start-flow{bottom:20px}}
</style>
