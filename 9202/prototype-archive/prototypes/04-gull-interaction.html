<!doctype html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f3; }
  canvas { display: block; touch-action: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

/* ---------------- 基础设置 ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#8fc8ec'); g.addColorStop(0.55, '#cfe8f5'); g.addColorStop(1, '#fbf1dc');
  x.fillStyle = g; x.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0.6, 0);
controls.minDistance = 8;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.49;
function placeCamera() {
  const a = innerWidth / innerHeight;
  const dist = Math.max(40, 44 / a);
  const dir = new THREE.Vector3(-0.12, 0.52, 0.85).normalize();
  camera.position.copy(controls.target).addScaledVector(dir, dist);
}
placeCamera();

const effect = new OutlineEffect(renderer, { defaultThickness: 0.0032, defaultColor: [0.2, 0.19, 0.32], defaultAlpha: 1 });

// 光照：午后暖阳 + 蓝紫色环境光（阴影偏蓝紫）
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8c86d0, 1.35));
const sun = new THREE.DirectionalLight(0xffdca8, 2.4);
sun.position.set(-14, 22, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 14, bottom: -14, near: 1, far: 70 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);

/* ---------------- 工具函数 ---------------- */
const grad = new THREE.DataTexture(new Uint8Array([110, 110, 110, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (c, o = {}) => new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...o });
const noOutline = (mat) => { mat.userData.outlineParameters = { visible: false }; return mat; };

function add(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true;
  parent.add(m); return m;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(9202);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const easeOutBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  t.anisotropy = 4; return t;
}

/* ---------------- 底座尺寸（3:1） ----------------
   z 方向（由内到外）：建筑 -5.5~-4.6 | 台阶 -4.6~-3.6 | 餐区 -3.6~-1.4 | 步道 -1.4~2.0 | 木栈道 2.0~3.0 | 海湾 3.0~5.5 */
const BX = 33, BZ = 11, HX = BX / 2;

/* ---------------- 海鸥影子投影画布 ---------------- */
const SR = { x: -7.2, z: -1.4, w: 14.4, h: 3.4 };
const PX = 100;
const sCanvas = document.createElement('canvas'); sCanvas.width = SR.w * PX; sCanvas.height = SR.h * PX;
const sctx = sCanvas.getContext('2d');
const shadowTex = new THREE.CanvasTexture(sCanvas); shadowTex.flipY = false;
const shadowUniforms = {
  uShadowTex: { value: shadowTex },
  uShadowRect: { value: new THREE.Vector4(SR.x, SR.z, SR.w, SR.h) },
  uShadowCol: { value: new THREE.Color(0.36, 0.32, 0.82) },
};
function projectShadows(mat) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, shadowUniforms);
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace('#include <project_vertex>',
      '#include <project_vertex>\n vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = 'varying vec3 vWP;\nuniform sampler2D uShadowTex;\nuniform vec4 uShadowRect;\nuniform vec3 uShadowCol;\n' +
      sh.fragmentShader.replace('#include <opaque_fragment>', `#include <opaque_fragment>
      vec2 suv = (vWP.xz - uShadowRect.xy) / uShadowRect.zw;
      if (suv.x > 0.0 && suv.x < 1.0 && suv.y > 0.0 && suv.y < 1.0) {
        float sa = texture2D(uShadowTex, suv).a;
        gl_FragColor.rgb = mix(gl_FragColor.rgb, gl_FragColor.rgb * uShadowCol, sa);
      }`);
  };
  mat.customProgramCacheKey = () => 'gullshadow';
  return mat;
}

/* ---------------- 底座 ---------------- */
add(new THREE.BoxGeometry(BX + 0.7, 0.5, BZ + 0.7), toon(0x5b3f30), 0, -1.65, 0);           // 胡桃木底座
add(new THREE.BoxGeometry(BX + 0.9, 0.06, BZ + 0.9), toon(0x4a3328), 0, -1.92, 0);
add(new THREE.BoxGeometry(BX, 1.2, 8.5), toon(0xdedad2), 0, -0.6, -1.25);                    // 陆地剖面
add(new THREE.BoxGeometry(BX, 0.25, 2.5), toon(0xd2bf92), 0, -1.275, 4.25);                  // 海床
// 海床上的石块与海草
for (let i = 0; i < 26; i++) {
  const r = 0.08 + rnd() * 0.16;
  add(new THREE.DodecahedronGeometry(r, 0), toon(i % 3 ? 0xa9a08d : 0x8e9a7a), -HX + 0.5 + rnd() * (BX - 1), -1.15 + r * 0.4, 3.2 + rnd() * 2.1);
}
// 海堤立面（带蜂窝状纹理，参考实景）
const seawallTex = canvasTex(256, 64, (x, w, h) => {
  x.fillStyle = '#d9d4ca'; x.fillRect(0, 0, w, h);
  x.fillStyle = '#b9b2a6';
  for (let i = 0; i < 16; i++) for (let j = 0; j < 3; j++) {
    const cx = i * 16 + (j % 2) * 8, cy = 36 + j * 10;
    x.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; x.lineTo(cx + Math.cos(a) * 5, cy + Math.sin(a) * 5); } x.fill();
  }
}, [8, 1]);
add(new THREE.PlaneGeometry(BX, 1.2), toon(0xffffff, { map: seawallTex }), 0, -0.6, 3.001, scene, false);

// 水体（透明剖面）+ 水面波纹
const water = add(new THREE.BoxGeometry(BX, 0.75, 2.5), noOutline(new THREE.MeshToonMaterial({ color: 0x3fb3c9, gradientMap: grad, transparent: true, opacity: 0.55, depthWrite: false })), 0, -0.775, 4.25, scene, false);
water.receiveShadow = false;
const rippleTex = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = '#ffffff'; x.lineCap = 'round';
  for (let i = 0; i < 28; i++) {
    const px = Math.random() * 256, py = Math.random() * 256, l = 14 + Math.random() * 26;
    x.lineWidth = 2 + Math.random() * 2; x.globalAlpha = 0.5 + Math.random() * 0.5;
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + l / 2, py - 5, px + l, py); x.stroke();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(9, 1.2); return t;
})();
const waterGeo = new THREE.PlaneGeometry(BX, 2.5, 132, 10); waterGeo.rotateX(-Math.PI / 2);
const waterTop = add(waterGeo, noOutline(new THREE.MeshToonMaterial({
  color: 0x55c4d6, gradientMap: grad, transparent: true, opacity: 0.86,
  emissive: 0xffffff, emissiveMap: rippleTex, emissiveIntensity: 0.55,
})), 0, -0.4, 4.25, scene, false);
const waterBase = waterGeo.attributes.position.array.slice();

/* ---------------- 地面铺装 ---------------- */
const paveTex = canvasTex(512, 128, (x, w, h) => {
  x.fillStyle = '#e3e4e4'; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(160,150,140,0.35)'; x.lineWidth = 2;
  for (let i = 0; i <= w; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let j = 0; j <= h; j += 32) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
}, [BX / 4, 3.4 / 2]);
const prom = add(new THREE.PlaneGeometry(BX, 3.4).rotateX(-Math.PI / 2), projectShadows(toon(0xffffff, { map: paveTex })), 0, 0.004, 0.3, scene, false);
prom.material.userData.outlineParameters = { visible: false };
const plankTex = canvasTex(256, 64, (x, w, h) => {
  x.fillStyle = '#c98f58'; x.fillRect(0, 0, w, h);
  for (let j = 0; j < 8; j++) {
    x.fillStyle = j % 2 ? '#c48852' : '#cf9861'; x.fillRect(0, j * 8, w, 7);
    x.fillStyle = '#9a6439'; x.fillRect(0, j * 8 + 7, w, 1);
    x.fillRect(((j * 97) % w), j * 8, 2, 7);
  }
}, [BX / 4, 1]);
add(new THREE.PlaneGeometry(BX, 1.0).rotateX(-Math.PI / 2), noOutline(toon(0xffffff, { map: plankTex })), 0, 0.006, 2.5, scene, false);

/* ---------------- 互动地砖：奶牛斑块形状 ---------------- */
function blobShape(r, seed) {
  const R = mulberry(seed); const a1 = R() * 6, a2 = R() * 6, k1 = 0.1 + R() * 0.1, k2 = 0.05 + R() * 0.06, sx = 0.85 + R() * 0.4;
  const pts = [];
  for (let i = 0; i < 56; i++) {
    const t = i / 56 * Math.PI * 2;
    const rr = r * (1 + k1 * Math.sin(2 * t + a1) + k2 * Math.sin(5 * t + a2) + 0.035 * Math.sin(9 * t + a1));
    pts.push(new THREE.Vector2(Math.cos(t) * rr * sx, Math.sin(t) * rr));
  }
  return new THREE.Shape(pts);
}
const TILE_TOP = 0.2;
const tiles = [];
{
  let tries = 0;
  while (tiles.length < 17 && tries < 4000) {
    tries++;
    const r = 0.4 + rnd() * 0.28;
    const x = -6.1 + rnd() * 12.2, z = -0.45 + rnd() * 1.5;
    if (tiles.some(t => Math.hypot(t.x - x, t.z - z) < (t.r + r) * 1.15 + 0.5)) continue;
    tiles.push({ x, z, r });
  }
  tiles.forEach((t, i) => {
    const geo = new THREE.ExtrudeGeometry(blobShape(t.r, 100 + i), { depth: 0.06, bevelEnabled: true, bevelThickness: 0.07, bevelSize: 0.12, bevelSegments: 4, curveSegments: 6 });
    geo.rotateX(-Math.PI / 2);
    const mat = projectShadows(toon(i % 2 ? 0xb9b1ec : 0xf1f3fb, { emissive: 0x9fe7ff, emissiveIntensity: 0 }));
    const m = add(geo, mat, t.x, 0.07, t.z);
    m.rotation.y = rnd() * Math.PI * 2;
    t.mesh = m; t.pulse = 0;
  });
  tiles.forEach((t, i) => { t.nb = tiles.map((o, j) => j).filter(j => j !== i && Math.hypot(tiles[j].x - t.x, tiles[j].z - t.z) < 2.9); });
}

/* ---------------- 台阶 + 鱼市建筑 + 波浪屋顶 ---------------- */
const stepMat = toon(0xefebe3), timber = toon(0xc98b52), white = toon(0xf7f5f0);
for (let i = 0; i < 3; i++) {
  const h = 0.28 * (i + 1);
  add(new THREE.BoxGeometry(BX, h, 0.34), stepMat, 0, h / 2, -3.77 - i * 0.34);
  for (let k = 0; k < 7; k++) {
    const x = -HX + 1.5 + ((k * 4.7 + i * 2.3) % (BX - 3));
    add(new THREE.BoxGeometry(1.6 + (k % 2) * 0.6, 0.09, 0.22), timber, x, h + 0.045, -3.77 - i * 0.34);
  }
}
const glassTex = canvasTex(512, 256, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#79a6c0'); g.addColorStop(1, '#2f4d66');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 14; i++) { x.fillStyle = 'rgba(255,214,150,0.55)'; x.fillRect(10 + i * 36, 150 + (i % 3) * 14, 18, 40); }
  x.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 6; i++) { x.beginPath(); x.moveTo(i * 96, 0); x.lineTo(i * 96 + 40, 0); x.lineTo(i * 96 - 30, h); x.lineTo(i * 96 - 70, h); x.fill(); }
  x.fillStyle = '#20364a';
  for (let i = 0; i <= w; i += 32) x.fillRect(i, 0, 3, h);
  x.fillRect(0, 90, w, 4);
}, [6, 1]);
add(new THREE.BoxGeometry(BX, 2.9, 0.9), [toon(0x2f4d66), toon(0x2f4d66), white, white, toon(0xffffff, { map: glassTex }), toon(0x2f4d66)], 0, 0.84 + 1.45, -5.05);
add(new THREE.BoxGeometry(BX, 0.32, 1.0), white, 0, 0.84 + 2.9 + 0.16, -5.05);
// 上层玻璃栏杆
add(new THREE.BoxGeometry(BX, 0.5, 0.04), noOutline(new THREE.MeshToonMaterial({ color: 0xbfe7f2, gradientMap: grad, transparent: true, opacity: 0.35 })), 0, 4.31, -4.55, scene, false);

const canopyY = (x, z) => 4.75 + 0.42 * Math.sin(x * 0.3 + 0.6) + (z + 5.8) * 0.17;
const latticeTex = canvasTex(512, 256, (x, w, h) => {
  x.fillStyle = '#f7efe1'; x.fillRect(0, 0, w, h);
  x.strokeStyle = '#c4823f'; x.lineWidth = 14;
  for (let i = -h; i < w + h; i += 128) {
    x.beginPath(); x.moveTo(i, 0); x.lineTo(i + h, h); x.stroke();
    x.beginPath(); x.moveTo(i + h, 0); x.lineTo(i, h); x.stroke();
  }
  x.strokeStyle = '#a8692f'; x.lineWidth = 4;
  for (let i = -h; i < w + h; i += 128) { x.beginPath(); x.moveTo(i + 7, 0); x.lineTo(i + h + 7, h); x.stroke(); }
}, [BX / 4, 1]);
{
  const geo = new THREE.PlaneGeometry(BX + 1, 2.7, 80, 6); geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i) - 4.45; p.setY(i, canopyY(x, z)); }
  geo.computeVertexNormals();
  const top = add(geo, white, 0, 0, -4.45);
  const under = add(geo, toon(0xffffff, { map: latticeTex, side: THREE.BackSide }), 0, 0, -4.45, scene, false);
  // 前缘白色檐口
  const f = new THREE.PlaneGeometry(BX + 1, 0.32, 80, 1); const fp = f.attributes.position;
  for (let i = 0; i < fp.count; i++) { const x = fp.getX(i); fp.setY(i, canopyY(x, -3.1) + fp.getY(i) - 0.1); }
  f.computeVertexNormals();
  add(f, toon(0xf3f1ec, { side: THREE.DoubleSide }), 0, 0, -3.1, scene);
  // 屋顶上的白色金字塔天窗（参考实景）
  const pyr = new THREE.ConeGeometry(0.62, 0.32, 4); pyr.rotateY(Math.PI / 4);
  for (let x = -HX + 0.6; x < HX; x += 1.05) for (const z of [-5.25, -4.4, -3.6]) {
    add(pyr, toon(0xf2f2f6), x, canopyY(x, z) + 0.16, z, scene, false);
  }
  // 柱子
  for (let x = -HX + 2; x < HX; x += 4.2) {
    const h = canopyY(x, -3.45);
    add(new THREE.CylinderGeometry(0.07, 0.07, h, 10), white, x, h / 2, -3.45);
  }
}

/* ---------------- 木栈道栏杆 ---------------- */
const steel = toon(0xd3dbe1);
const glassMat = noOutline(new THREE.MeshToonMaterial({ color: 0xc8eef6, gradientMap: grad, transparent: true, opacity: 0.28, depthWrite: false }));
for (let x = -HX + 0.2; x <= HX - 0.1; x += 1.1) {
  if (x > 11.0 && x < 13.0) continue;
  add(new THREE.CylinderGeometry(0.035, 0.035, 1.0, 8), steel, x, 0.5, 2.95);
  const nx = x + 1.1;
  if (nx <= HX && !(nx > 11.0 && nx < 13.0)) {
    add(new THREE.BoxGeometry(1.02, 0.7, 0.02), glassMat, x + 0.55, 0.45, 2.95, scene, false);
    const rail = add(new THREE.CylinderGeometry(0.03, 0.03, 1.1, 8), steel, x + 0.55, 1.0, 2.95); rail.rotation.z = Math.PI / 2;
  }
}

/* ---------------- 小栈桥（真实海鸥停在这里，远离儿童区） ---------------- */
add(new THREE.BoxGeometry(1.4, 0.12, 2.4), toon(0xc28a55), 12, -0.12, 4.25);
for (const [px, pz] of [[11.35, 3.2], [12.65, 3.2], [11.35, 4.3], [12.65, 4.3], [11.35, 5.35], [12.65, 5.35]]) {
  add(new THREE.CylinderGeometry(0.09, 0.09, 1.55, 10), toon(0x8a6a4c), px, -0.4, pz);
}

/* ---------------- 海鸥（真实） ---------------- */
function makeGull() {
  const g = new THREE.Group();
  const w = toon(0xffffff), grey = toon(0xa7b3c2), yel = toon(0xf5c33b), org = toon(0xf08a3c), blk = toon(0x222222);
  add(new THREE.SphereGeometry(0.13, 14, 10).scale(1, 0.9, 1.9), w, 0, 0.22, 0, g);
  const head = new THREE.Group(); head.position.set(0, 0.36, 0.2); g.add(head);
  add(new THREE.SphereGeometry(0.09, 12, 10), w, 0, 0, 0, head);
  const beak = add(new THREE.ConeGeometry(0.03, 0.12, 8), yel, 0, -0.01, 0.12, head); beak.rotation.x = Math.PI / 2;
  for (const s of [-1, 1]) add(new THREE.SphereGeometry(0.014, 6, 6), blk, 0.06 * s, 0.025, 0.06, head);
  const wings = [];
  for (const s of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(0.1 * s, 0.27, 0); g.add(piv);
    const wm = add(new THREE.SphereGeometry(0.12, 10, 8).scale(0.6, 0.25, 1.8), grey, 0.04 * s, 0, -0.06, piv);
    wings.push(piv);
  }
  const tail = add(new THREE.ConeGeometry(0.07, 0.16, 6), toon(0x4c5662), 0, 0.24, -0.3, g); tail.rotation.x = -Math.PI / 2;
  for (const s of [-1, 1]) add(new THREE.CylinderGeometry(0.012, 0.012, 0.12, 6), org, 0.05 * s, 0.06, 0, g);
  return { g, head, wings };
}
const perched = [];
for (const [x, y, z, ry] of [[11.35, 0.33, 3.2, 0.6], [12.65, 0.33, 4.3, -1.2], [12.65, 0.33, 5.35, 2.4], [14.7, 1.02, 2.95, 1.4], [15.8, 1.02, 2.95, -0.5]]) {
  const b = makeGull(); b.g.position.set(x, y, z); b.g.rotation.y = ry; scene.add(b.g);
  b.phase = Math.random() * 10; perched.push(b);
}
const flyers = [];
for (let i = 0; i < 2; i++) {
  const b = makeGull(); scene.add(b.g);
  b.wings[0].rotation.z = 0; b.c = new THREE.Vector3(12.5, 5.2 + i * 0.8, 4.2); b.r = 1.6 + i * 0.7; b.a = i * 3; b.sp = 0.5 + i * 0.15;
  b.g.scale.setScalar(1.1); flyers.push(b);
}

/* ---------------- 渔船 + 信号旗 ---------------- */
function flagTex(type) {
  return canvasTex(64, 48, (x, w, h) => {
    if (type === 0) { x.fillStyle = '#ffd23f'; x.fillRect(0, 0, w, h); x.fillStyle = '#e8453c'; x.beginPath(); x.moveTo(0, 0); x.lineTo(w, 0); x.lineTo(w, h); x.fill(); }
    if (type === 1) { for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) { x.fillStyle = (i + j) % 2 ? '#ffffff' : '#2f63c9'; x.fillRect(i * 16, j * 16, 16, 16); } }
    if (type === 2) { for (let i = 0; i < 6; i++) { x.fillStyle = i % 2 ? '#2f63c9' : '#ffd23f'; x.fillRect(i * w / 6, 0, w / 6 + 1, h); } }
    if (type === 3) { x.fillStyle = '#e8453c'; x.fillRect(0, 0, w, h); x.fillStyle = '#ffffff'; x.fillRect(0, h / 3, w, h / 3); }
  });

    if (s.life <= 0) continue;
    s.life -= dt; s.position.addScaledVector(s.v, dt); s.v.y -= dt * 0.6;
    const k = s.life / s.max; s.material.opacity = Math.min(1, k * 2) * (0.6 + 0.4 * Math.sin(s.life * 30));
    s.scale.setScalar(s.sz * (0.6 + k * 0.6));
    if (s.life <= 0) s.visible = false;
  }
  if (!fx.active) return;
  fx.t += dt; const t = fx.t;
  // 地面薯条图案弹出
  const pt = clamp(t / 0.4, 0, 1);
  pattern.scale.setScalar(Math.max(0.01, easeOutBack(pt)) * (1 + 0.04 * Math.sin(t * 9)));
  pattern.rotation.y = t * 0.6;
  pattern.material.opacity = t < 1.4 ? 1 : clamp(1 - (t - 1.4) / 0.7, 0, 1);
  if (t > 2.2) pattern.visible = false;
  // 选择投喂目标影子
  if (t >= 1.2 && !fx.target) {
    let best = null, bd = 1e9;
    for (const s of shadows) if (s.state === 'on' && s.life > 1.5) { const d = Math.hypot(s.x - fx.c.x, s.z - fx.c.z); if (d < bd) { bd = d; best = s; } }
    if (!best) {
      best = shadows.find(s => s.state === 'off') || shadows[0];
      const side = fx.c.x > 0 ? -1 : 1;
      spawnShadow(best, fx.c.x + side * 2.6, fx.c.z);
      best.alpha = 0.6;
    }
    best.life = Math.max(best.life, 4.5);
    fx.target = best;
  }
  fries.forEach((f, i) => {
    if (!f.visible) return;
    const h = f.userData.home;
    if (t < 1.2 || !fx.target) {
      const lt = clamp((t - i * 0.03) / 0.45, 0, 1);
      f.scale.setScalar(Math.max(0.01, easeOutBack(lt)));
      f.position.set(h.x, TILE_TOP + 0.22 + Math.abs(Math.sin(t * 6 + i)) * 0.08, h.z);
      f.rotation.set(Math.cos(f.userData.a) * 0.5, t * 2 + i, Math.sin(f.userData.a) * 0.5);
    } else {
      const lt = clamp((t - 1.2 - i * 0.06) / 0.85, 0, 1);
      const tx = fx.target.x, tz = fx.target.z;
      f.position.set(h.x + (tx - h.x) * lt, TILE_TOP + 0.22 + Math.sin(lt * Math.PI) * 1.5, h.z + (tz - h.z) * lt);
      f.rotation.x += dt * 8; f.rotation.z += dt * 5;
      f.scale.setScalar(1 - lt * 0.5);
      if (lt >= 1) { f.visible = false; if (!fx.fed) { fx.fed = true; fx.target.happy = 2.6; burst(tx, 0.3, tz, 10); } }
    }
  });
  if (t > 3.2) { fx.active = false; fx.cooldown = 6.5; fries.forEach(f => f.visible = false); }
}

/* ---------------- 孩子行为 ---------------- */
function chooseNext(k) {
  const other = k === kidA ? kidB : kidA;
  const nb = tiles[k.tile].nb.filter(i => i !== other.tile && i !== other.toTile);
  if (!nb.length) { k.idle = 0.5; return; }
  let target = null;
  const vis = shadows.filter(s => s.state === 'on' && s.alpha > 0.4);
  if (k.role === 'follow' && Math.random() < 0.7) target = { x: other.pos.x, z: other.pos.z };
  else if (vis.length && Math.random() < 0.85) {
    target = vis.reduce((a, b) => Math.hypot(a.x - k.pos.x, a.z - k.pos.z) < Math.hypot(b.x - k.pos.x, b.z - k.pos.z) ? a : b);
  }
  let idx;
  if (target) {
    idx = nb.reduce((a, b) => Math.hypot(tiles[a].x - target.x, tiles[a].z - target.z) + Math.random() * 0.4 < Math.hypot(tiles[b].x - target.x, tiles[b].z - target.z) + Math.random() * 0.4 ? a : b);
  } else idx = nb[Math.floor(Math.random() * nb.length)];
  const to = tiles[idx];
  k.toTile = idx; k.hopping = true; k.t = 0;
  k.from.copy(k.pos); k.to.set(to.x + rand(-0.12, 0.12), TILE_TOP, to.z + rand(-0.12, 0.12));
  const d = k.from.distanceTo(k.to);
  k.dur = 0.42 + d * 0.13; k.h = 0.32 + d * 0.1;
  k.face = Math.atan2(k.to.x - k.from.x, k.to.z - k.from.z);
}
function turnTo(obj, target, dt, speed = 10) {
  let d = target - obj.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); obj.rotation.y += d * Math.min(1, dt * speed);
}
function updateKid(k, dt, time) {
  const cheer = fx.active && fx.t < 2.8;
  if (k.hopping) {
    k.t += dt / k.dur; const t = Math.min(k.t, 1);
    k.pos.lerpVectors(k.from, k.to, t); k.pos.y = TILE_TOP + Math.sin(Math.PI * t) * k.h;
    turnTo(k.g, k.face, dt, 14);
    k.legs[0].rotation.x = 0.55; k.legs[1].rotation.x = -0.45;
    k.arms[0].rotation.x = -0.9; k.arms[1].rotation.x = 0.6; k.arms[0].rotation.z = k.arms[1].rotation.z = 0;
    if (k.t >= 1) {
      k.hopping = false; k.tile = k.toTile; k.idle = rand(0.25, 0.9); k.pos.y = TILE_TOP;
      tiles[k.tile].pulse = 1;
    }
  } else {
    const other = k === kidA ? kidB : kidA;
    if (cheer) {
      k.pos.y = TILE_TOP + Math.abs(Math.sin(time * 8 + (k === kidA ? 0 : 1.2))) * 0.18;
      k.arms[0].rotation.z = -2.6; k.arms[1].rotation.z = 2.6; k.arms[0].rotation.x = k.arms[1].rotation.x = 0;
      const look = fx.target && fx.t > 1.2 ? fx.target : { x: other.pos.x, z: other.pos.z };
      turnTo(k.g, Math.atan2(look.x - k.pos.x, look.z - k.pos.z), dt, 6);
    } else {
      k.pos.y = TILE_TOP;
      k.arms.forEach((a, i) => { a.rotation.z *= 0.8; a.rotation.x = Math.sin(time * 3 + i) * 0.15; });
      k.idle -= dt;
      if (k.idle <= 0) chooseNext(k);
    }
    k.legs.forEach(l => l.rotation.x *= 0.7);
  }
  k.g.position.copy(k.pos);
  k.head.rotation.z = Math.sin(time * 2.2 + (k === kidA ? 0 : 2)) * 0.06;
}

/* ---------------- 动画循环 ---------------- */
const clock = new THREE.Clock();
function animate() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;

  // 水面波纹
  const p = waterGeo.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    p[i + 1] = 0.035 * Math.sin(x * 1.2 + time * 1.4) + 0.025 * Math.sin(z * 3.1 + x * 0.4 + time * 2.0);
  }
  waterGeo.attributes.position.needsUpdate = true; waterGeo.computeVertexNormals();
  rippleTex.offset.set(time * 0.012, Math.sin(time * 0.3) * 0.02);
  boat.position.y = -0.42 + Math.sin(time * 1.3) * 0.03; boat.rotation.x = Math.sin(time * 1.1) * 0.03; boat.rotation.z = Math.sin(time * 0.9) * 0.015;

  // 旗帜飘动
  for (const f of flags) {
    const pa = f.geometry.attributes.position.array, b = f.userData.base;
    for (let i = 0; i < pa.length; i += 3) pa[i + 2] = Math.sin(b[i] * 7 - time * 6 + f.userData.ph) * 0.06 * (b[i] / 0.75);
    f.geometry.attributes.position.needsUpdate = true;
  }

  // 真实海鸥：停留 + 远处盘旋
  for (const b of perched) {
    b.head.rotation.y = Math.sin(time * 0.7 + b.phase) * 0.6;
    b.head.position.y = 0.36 + Math.max(0, Math.sin(time * 2.3 + b.phase)) * 0.02;
  }
  for (const b of flyers) {
    b.a += dt * b.sp;
    b.g.position.set(b.c.x + Math.cos(b.a) * b.r, b.c.y + Math.sin(b.a * 2) * 0.2, b.c.z + Math.sin(b.a) * b.r * 0.6);
    b.g.rotation.y = -b.a;
    b.g.rotation.z = 0.25;
    const w = Math.sin(time * 7 + b.r) * 0.7;
    b.wings[0].rotation.z = w; b.wings[1].rotation.z = -w;
  }

  // 海鸥影子 + 孩子 + 薯条
  updateShadows(dt);
  updateKid(kidA, dt, time);
  updateKid(kidB, dt, time);
  if (!fx.active && fx.cooldown <= 0 && !kidA.hopping && !kidB.hopping && kidA.pos.distanceTo(kidB.pos) < 2.8) {
    startFx((kidA.pos.x + kidB.pos.x) / 2, (kidA.pos.z + kidB.pos.z) / 2);
  }
  updateFx(dt);
  drawShadows();
  for (const t of tiles) { t.pulse = Math.max(0, t.pulse - dt * 1.6); t.mesh.material.emissiveIntensity = t.pulse * 0.45; }

  // 吃东西的家长 / 看孩子的家长 / 散步的行人
  for (const d of diners) {
    const e = Math.max(0, Math.sin(time * 1.2 + d.ph));
    d.arms[1].rotation.x = -e * 1.7; d.head.rotation.x = Math.sin(time * 0.8 + d.ph) * 0.08;
  }
  turnTo(watcher.head, clamp(Math.atan2(kidA.pos.x - 8.3, kidA.pos.z - 0.6) + Math.PI / 2, -1, 1), dt, 3);
  watcher.g.rotation.y = -Math.PI / 2;
  walker.g.position.x += walker.dir * dt * 1.1;
  if (Math.abs(walker.g.position.x) > 14.5) walker.dir *= -1;
  walker.g.rotation.y = walker.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
  const ws = Math.sin(time * 6.5);
  walker.legs[0].rotation.x = ws * 0.5; walker.legs[1].rotation.x = -ws * 0.5;
  walker.arms[0].rotation.x = -ws * 0.4; walker.arms[1].rotation.x = ws * 0.4;
  walker.g.position.y = Math.abs(Math.cos(time * 6.5)) * 0.03;

  controls.update();
  effect.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
