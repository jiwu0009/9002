<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sydney Fish Market Interactive Installations — 3D Model</title>
  <style>
    :root{--ink:#173248;--muted:#617384;--blue:#2478b5;--blue2:#74c4ef;--cream:#f7f3ea;--card:rgba(255,255,255,.88);--line:rgba(28,63,87,.14);--orange:#ff8a52;--yellow:#ffd34c}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#dfeaed}
    body{background:radial-gradient(circle at 30% 15%,#fff 0,#eef6f7 42%,#cbdde1 100%)}
    button{font:inherit}
    #app{height:100%;display:grid;grid-template-rows:auto 1fr;position:relative}
    header{height:86px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(255,255,255,.84);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);z-index:5;box-shadow:0 5px 24px rgba(25,58,77,.08)}
    .brand{display:flex;align-items:center;gap:14px;min-width:0}
    .logo{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#72c8f3,#176aa5);box-shadow:0 9px 20px rgba(24,105,164,.28);position:relative;flex:0 0 auto}
    .logo:before{content:"";position:absolute;width:23px;height:14px;border-radius:60% 45% 45% 60%;background:white;left:10px;top:17px}
    .logo:after{content:"";position:absolute;border-left:10px solid white;border-top:7px solid transparent;border-bottom:7px solid transparent;left:29px;top:17px}
    h1{font-size:18px;line-height:1.2;margin:0;font-weight:790;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand p{font-size:12px;margin:4px 0 0;color:var(--muted);font-weight:560}
    .scene-tabs{display:flex;gap:6px;background:#edf3f5;padding:5px;border-radius:15px}
    .scene-tab{border:0;background:transparent;color:#547082;padding:10px 16px;border-radius:11px;font-weight:750;cursor:pointer;transition:.2s}
    .scene-tab.active{background:white;color:var(--blue);box-shadow:0 4px 15px rgba(23,61,85,.12)}
    main{min-height:0;position:relative}
    #viewport{position:absolute;inset:0;cursor:grab}
    #viewport:active{cursor:grabbing}
    canvas{display:block;width:100%;height:100%;outline:0}
    .top-tools{position:absolute;right:22px;top:18px;display:flex;gap:8px;z-index:4}
    .tool{border:1px solid rgba(29,73,102,.14);background:rgba(255,255,255,.88);backdrop-filter:blur(12px);color:#31566e;border-radius:12px;padding:9px 12px;font-size:12px;font-weight:720;cursor:pointer;box-shadow:0 8px 22px rgba(28,56,72,.08);transition:.2s}
    .tool:hover,.tool.active{background:#1d73ad;color:white;transform:translateY(-1px)}
    .step-panel{position:absolute;left:22px;top:18px;width:min(315px,calc(100vw - 44px));background:var(--card);backdrop-filter:blur(16px);border:1px solid rgba(30,70,95,.14);border-radius:20px;padding:18px;z-index:4;box-shadow:0 18px 42px rgba(30,58,73,.14)}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6a8293;font-weight:800;margin-bottom:12px}
    .steps{display:grid;gap:8px}
    .steps button{border:1px solid rgba(31,75,103,.11);background:#f7fafb;color:#496779;border-radius:13px;text-align:left;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:.18s}
    .steps button:before{content:attr(data-number);display:inline-grid;place-items:center;width:23px;height:23px;border-radius:8px;background:#e3edf2;color:#2b678c;margin-right:9px;font-size:11px}
    .steps button.active{background:linear-gradient(135deg,#1e76b3,#55aee0);color:white;border-color:transparent;box-shadow:0 8px 18px rgba(29,116,177,.24)}
    .steps button.active:before{background:rgba(255,255,255,.2);color:white}
    .info-card{position:absolute;left:22px;bottom:22px;width:min(470px,calc(100vw - 44px));background:rgba(20,49,68,.9);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.15);color:white;border-radius:19px;padding:17px 19px;z-index:4;box-shadow:0 18px 42px rgba(17,40,53,.25)}
    .info-card h2{margin:0 0 7px;font-size:18px}
    .info-card p{margin:0;color:#d9e9f2;font-size:13px;line-height:1.55}
    .gesture{position:absolute;right:22px;bottom:22px;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);color:#4b6677;font-size:12px;font-weight:650;z-index:4;box-shadow:0 9px 24px rgba(22,50,67,.11)}
    .legend{position:absolute;right:22px;top:72px;display:grid;gap:7px;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);padding:11px 13px;border-radius:13px;z-index:4;font-size:11px;color:#526c7b;border:1px solid rgba(28,63,87,.12)}
    .legend span{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.single{background:#73b9ff}.group{background:#ffd55e}.nfc{background:#63c482}
    #app[data-scene="outdoor"] .legend{display:none}
    @media(max-width:760px){header{height:118px;padding:14px 16px;align-items:flex-start;gap:8px;flex-direction:column}.scene-tabs{align-self:stretch}.scene-tab{flex:1;padding:8px}.brand p{display:none}.step-panel{top:12px;left:12px;width:245px;padding:13px}.top-tools{right:12px;top:12px;flex-direction:column}.tool{padding:7px 9px}.legend{display:none!important}.info-card{left:12px;bottom:12px;width:calc(100vw - 24px);padding:13px 15px}.gesture{display:none}.info-card p{font-size:12px}.steps button{font-size:12px;padding:8px 9px}}
  </style>
</head>
<body>
  <div id="app" data-scene="indoor">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div><h1>Sydney Fish Market Interactive Experience</h1><p>Rotatable 3D concept model · FishPal + Gull-Shadow</p></div>
      </div>
      <nav class="scene-tabs" aria-label="Choose installation">
        <button class="scene-tab active" data-scene="indoor">Indoor · FishPal</button>
        <button class="scene-tab" data-scene="outdoor">Outdoor · Gull-Shadow</button>
      </nav>
    </header>
    <main>
      <div id="viewport" aria-label="Interactive 3D model"></div>
      <div class="step-panel">
        <div class="eyebrow">Interaction state</div>
        <div class="steps" id="indoorSteps">
          <button data-state="entrance" data-number="1">Entrance & Pick-up</button>
          <button data-state="single" data-number="2">Single Catch</button>
          <button data-state="group" data-number="3">Group Mode Catch</button>
        </div>
        <div class="steps" id="outdoorSteps" hidden>
          <button data-state="follow" data-number="1">Responsive Seagull</button>
          <button data-state="duo" data-number="2">Two-person Medal</button>
          <button data-state="trio" data-number="3">Multi-user Medal</button>
        </div>
      </div>
      <div class="top-tools">
        <button class="tool" id="resetView">Reset view</button>
        <button class="tool" id="autoRotate">Auto rotate</button>
        <button class="tool" id="snapshot">Save view</button>
      </div>
      <div class="legend"><span><i class="dot single"></i>Left: Single Catch</span><span><i class="dot group"></i>Right: Group Catch</span><span><i class="dot nfc"></i>NFC Catch Point</span></div>
      <section class="info-card"><h2 id="stateTitle"></h2><p id="stateText"></p></section>
      <div class="gesture">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
    </main>
  </div>
