<script type="module">

const P = {

  deep: 0x4A738C, line: 0x365264, orange: 0xF2A56D, red: 0xDA7E83, silver: 0xB5CBD4,

const OUT = [0x36 / 255, 0x52 / 255, 0x64 / 255];

/* ================= 基础设置 ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

controls.target.set(3.4, 0.7, -1.2);

{
  const a = innerWidth / innerHeight;
  const dist = Math.max(35, 58 / a);

}

// 灯光：柔和主光（暖白，给肤色和橙色留温度）+ 冷色补光 + 适度环境光

Object.assign(key.shadow.camera, { left: -22, right: 22, top: 14, bottom: -14, near: 1, far: 70 });
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.02;

scene.add(fill);

/* ================= 材质与工具 ================= */
// 四阶明暗：亮面 / 中间色 / 阴影面 / 接触暗部
const grad = new THREE.DataTexture(new Uint8Array([95, 95, 95, 255, 150, 150, 150, 255, 205, 205, 205, 255, 255, 255, 255, 255]), 4, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
// 背景结构：细、轻的深灰蓝线
const toon = (c, o = {}) => { const m = new THREE.MeshToonMaterial({ color: c, gradientMap: grad, ...o }); m.userData.outlineParameters = { thickness: 0.0022, color: OUT, alpha: 0.7 }; return m; };
// 主体（FishPal、人物、鱼、海鲜、立牌）：更清楚的外轮廓
const toonF = (c, o = {}) => { const m = toon(c, o); m.userData.outlineParameters = { thickness: 0.0042, color: OUT, alpha: 1 }; return m; };
const noOutline = (m) => { m.userData.outlineParameters = { visible: false }; return m; };
function add(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = shadow; m.receiveShadow = true; parent.add(m); return m;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry(9202);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const softTex = canvasTex(64, 64, (x) => {
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
});
// 接触阴影：让物体“站得住”
const contactMat = noOutline(new THREE.MeshBasicMaterial({ map: softTex, color: P.line, transparent: true, opacity: 0.32, depthWrite: false }));
function contact(x, z, sx, sz, y = 0.012, parent = scene, op) {
  const m = add(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), op ? noOutline(contactMat.clone()) : contactMat, x, y, z, parent, false);
  if (op) m.material.opacity = op;
  m.scale.set(sx, 1, sz); m.renderOrder = 1; return m;
}

/* ================= 底座 x -12~12, z -6~3.6 ================= */
add(new THREE.BoxGeometry(24.7, 0.5, 10.3), toon(P.deep), 0, -0.85, -1.2);
add(new THREE.BoxGeometry(24.9, 0.06, 10.5), toon(P.line), 0, -1.12, -1.2);
add(new THREE.BoxGeometry(24, 0.6, 9.6), toon(0xd3dee3), 0, -0.3, -1.2);
const floorTex = canvasTex(512, 256, (x, w, h) => {
  x.fillStyle = '#E4ECEF'; x.fillRect(0, 0, w, h);
  for (let i = 0; i < 500; i++) { x.fillStyle = 'rgba(120,150,165,0.10)'; x.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  x.strokeStyle = 'rgba(74,115,140,0.18)'; x.lineWidth = 2;
  for (let i = 0; i <= w; i += 128) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let j = 0; j <= h; j += 128) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
}, [6, 2.4]);
add(new THREE.PlaneGeometry(24, 9.6).rotateX(-Math.PI / 2), noOutline(toon(0xffffff, { map: floorTex })), 0, 0.002, -1.2, scene, false);
// 排水沟格栅
const grateTex = canvasTex(256, 16, (x, w, h) => { x.fillStyle = '#4A738C'; x.fillRect(0, 0, w, h); x.fillStyle = '#9fb7c4'; for (let i = 0; i < w; i += 6) x.fillRect(i, 2, 3, h - 4); }, [14, 1]);
add(new THREE.PlaneGeometry(11.2, 0.22).rotateX(-Math.PI / 2), noOutline(toon(0xffffff, { map: grateTex })), 6, 0.006, -2.55, scene, false);
// 湿地面：低对比的柔和亮斑
const puddleMat = noOutline(new THREE.MeshBasicMaterial({ map: softTex, color: 0xf4fbff, transparent: true, opacity: 0.55, depthWrite: false }));
const shineMat = noOutline(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false }));
for (const [x, z, sx, sz] of [[3.5, -1.8, 1.6, 0.6], [8.6, -1.6, 1.1, 0.45], [-1.5, 0.9, 1.3, 0.55], [5.2, 1.6, 0.9, 0.35]]) {
  const p = add(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), puddleMat, x, 0.008, z, scene, false); p.scale.set(sx * 2, 1, sz * 2);
  const s = add(new THREE.PlaneGeometry(0.45 * sx, 0.04).rotateX(-Math.PI / 2), shineMat, x - 0.2 * sx, 0.01, z - 0.1 * sz, scene, false); s.rotation.y = 0.2;
}

/* ================= 后墙：规则釉面砖（轻微冷色变化） ================= */
const tileTex = canvasTex(512, 256, (x, w, h) => {
  for (let i = 0; i < 16; i++) for (let j = 0; j < 8; j++) {
    const l = 46 + ((i * 7 + j * 3) % 3) * 1.5;
    x.fillStyle = `hsl(203, 30%, ${l}%)`; x.fillRect(i * 32, j * 32, 32, 32);
    x.fillStyle = 'rgba(255,255,255,0.14)'; x.fillRect(i * 32 + 4, j * 32 + 4, 9, 2);
  }
  x.strokeStyle = '#3d6176'; x.lineWidth = 2;
  for (let i = 0; i <= w; i += 32) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, h); x.stroke(); }
  for (let j = 0; j <= h; j += 32) { x.beginPath(); x.moveTo(0, j); x.lineTo(w, j); x.stroke(); }
}, [6, 2]);
add(new THREE.BoxGeometry(24, 4.2, 0.3), [toon(P.deep), toon(P.deep), toon(P.deep), toon(P.deep), toon(0xffffff, { map: tileTex }), toon(P.deep)], 0, 2.1, -5.85);
add(new THREE.BoxGeometry(24, 0.5, 0.06), toon(0xdbe6eb), 0, 0.25, -5.68, scene, false);                    // 浅色墙裙
add(new THREE.BoxGeometry(24.2, 0.7, 1.4), toon(P.line), 0, 4.55, -5.3);
add(new THREE.BoxGeometry(24, 0.06, 0.12), new THREE.MeshBasicMaterial({ color: 0xf2fbff }), 0, 4.17, -4.7, scene, false);
function neonArch(icon) {
  return canvasTex(256, 320, (x, w, h) => {
    x.fillStyle = '#365264'; x.beginPath(); x.moveTo(20, h); x.lineTo(20, 128); x.arc(128, 128, 108, Math.PI, 0); x.lineTo(236, h); x.closePath(); x.fill();
    x.strokeStyle = '#2a4252'; x.lineWidth = 8; x.stroke();
    x.save(); x.translate(128, 150); x.lineCap = 'round'; x.lineJoin = 'round';
    for (const [lw, col] of [[16, 'rgba(142,238,255,0.28)'], [6, '#e6fbff']]) {
      x.strokeStyle = col; x.lineWidth = lw; x.beginPath();
      if (icon === 'fish') { x.ellipse(-10, 0, 52, 30, 0, 0, Math.PI * 2); x.moveTo(40, 0); x.lineTo(76, -26); x.lineTo(76, 26); x.closePath(); }
      if (icon === 'snow') { for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; x.moveTo(Math.cos(a) * -60, Math.sin(a) * -60); x.lineTo(Math.cos(a) * 60, Math.sin(a) * 60); } for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3, px = Math.cos(a) * 38, py = Math.sin(a) * 38; x.moveTo(px, py); x.lineTo(px + Math.cos(a + 0.7) * 16, py + Math.sin(a + 0.7) * 16); x.moveTo(px, py); x.lineTo(px + Math.cos(a - 0.7) * 16, py + Math.sin(a - 0.7) * 16); } }
      if (icon === 'wave') { for (let r = -1; r <= 1; r++) { x.moveTo(-70, r * 30); for (let k = 0; k <= 28; k++) x.lineTo(-70 + k * 5, r * 30 + Math.sin(k * 0.45) * 10); } }
      x.stroke();
    }
    x.restore();
  });
}
for (const [xp, icon] of [[-0.05, 'fish'], [3.5, 'snow'], [8.8, 'wave']]) {
  add(new THREE.PlaneGeometry(1.7, 2.12), noOutline(new THREE.MeshBasicMaterial({ map: neonArch(icon), transparent: true })), xp, 2.95, -5.69, scene, false);
}

/* ================= 立柱、灯管、球形吊灯、挂牌 ================= */
for (const x of [-11.75, 11.75]) add(new THREE.BoxGeometry(0.3, 4.9, 0.3), toon(P.line), x, 2.45, -4.7);
const wire = toon(P.line);
for (const [x, z, len] of [[-6, -3.6, 8.5], [6, -3.6, 10]]) {
  add(new THREE.CylinderGeometry(0.008, 0.008, 1.1, 4), wire, x - len / 2 + 0.3, 3.95, z, scene, false);
  add(new THREE.CylinderGeometry(0.008, 0.008, 1.1, 4), wire, x + len / 2 - 0.3, 3.95, z, scene, false);
  add(new THREE.BoxGeometry(len, 0.1, 0.22), toon(P.deep), x, 3.42, z, scene, false);
  const t = add(new THREE.CylinderGeometry(0.05, 0.05, len - 0.2, 10), new THREE.MeshBasicMaterial({ color: 0xf2fbff }), x, 3.33, z, scene, false); t.rotation.z = Math.PI / 2;
}
for (const x of [2.5, 6, 9.5]) {
  add(new THREE.CylinderGeometry(0.008, 0.008, 1.2, 4), wire, x, 3.85, -2.9, scene, false);
  add(new THREE.SphereGeometry(0.3, 20, 14), new THREE.MeshBasicMaterial({ color: 0xfbfdf9 }), x, 3.0, -2.9, scene, false);
}
const boardTex = canvasTex(128, 96, (x, w, h) => {
  x.fillStyle = '#2f4757'; x.fillRect(0, 0, w, h); x.strokeStyle = '#8BBBD1'; x.lineWidth = 5; x.strokeRect(3, 3, w - 6, h - 6);
  x.strokeStyle = '#eef6f8'; x.lineWidth = 3; x.beginPath(); x.ellipse(56, 46, 26, 14, 0, 0, Math.PI * 2); x.moveTo(80, 46); x.lineTo(98, 34); x.lineTo(98, 58); x.closePath(); x.stroke();
  x.fillStyle = '#F2A56D'; x.fillRect(22, 72, 40, 4); x.fillStyle = '#C1E4EF'; x.fillRect(68, 72, 30, 4);
});
for (const x of [-9.4, -6.0, -2.6]) {
  for (const s of [-0.3, 0.3]) add(new THREE.CylinderGeometry(0.006, 0.006, 0.9, 4), wire, x + s, 3.0, -4.9, scene, false);
  add(new THREE.BoxGeometry(0.9, 0.62, 0.04), [toon(P.line), toon(P.line), toon(P.line), toon(P.line), toon(0xffffff, { map: boardTex }), toon(P.line)], x, 2.62, -4.9);
}

/* ================= 活鱼水缸 ================= */
const steel = toon(0xc9d7df);
const steelEdge = toon(0xeef5f8);
const glassMat = noOutline(new THREE.MeshToonMaterial({ color: 0xeaf8ff, gradientMap: grad, transparent: true, opacity: 0.08, depthWrite: false }));
const waterMat = noOutline(new THREE.MeshToonMaterial({ color: P.ice, gradientMap: grad, transparent: true, opacity: 0.22, depthWrite: false }));
const waterTopMat = noOutline(new THREE.MeshBasicMaterial({ color: 0xa9d8ea, transparent: true, opacity: 0.45, depthWrite: false, side: THREE.DoubleSide }));
const waterLineMat = noOutline(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75, depthWrite: false }));
const glassLineMat = noOutline(new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false }));
const SPECIES = [
  { body: P.orange, belly: 0xF9D7BC, fin: 0xE58F55 },
  { body: P.red, belly: 0xF2C3C5, fin: 0xC8686F },
  { body: P.silver, belly: 0xEEF4F6, fin: 0x8FA9B6 },
];
function makeFish(sp, size) {
  const g = new THREE.Group();
  add(new THREE.SphereGeometry(0.5, 20, 14).scale(1, 0.6, 0.36), toonF(sp.body), 0, 0, 0, g);
  add(new THREE.SphereGeometry(0.42, 16, 10).scale(0.92, 0.36, 0.34), noOutline(toon(sp.belly)), 0.03, -0.12, 0, g, false);
  const tail = new THREE.Group(); tail.position.x = -0.44; g.add(tail);
  // 分叉尾鳍
  const ts = new THREE.Shape(); ts.moveTo(0, 0); ts.lineTo(-0.3, 0.22); ts.quadraticCurveTo(-0.22, 0, -0.3, -0.22); ts.closePath();
  add(new THREE.ExtrudeGeometry(ts, { depth: 0.03, bevelEnabled: false }).translate(0, 0, -0.015), toonF(sp.fin), 0, 0, 0, tail);
  const ds = new THREE.Shape(); ds.moveTo(-0.22, 0); ds.quadraticCurveTo(-0.02, 0.2, 0.18, 0); ds.closePath();
  add(new THREE.ExtrudeGeometry(ds, { depth: 0.02, bevelEnabled: false }).translate(0, 0, -0.01), toonF(sp.fin), -0.02, 0.27, 0, g);
  for (const s of [-1, 1]) {
    add(new THREE.SphereGeometry(0.06, 10, 8), noOutline(toon(0xffffff)), 0.3, 0.06, 0.15 * s, g, false);
    add(new THREE.SphereGeometry(0.035, 8, 6), noOutline(toon(P.line)), 0.33, 0.06, 0.175 * s, g, false);
  }
  g.scale.setScalar(size);
  return { g, tail };
}
const tanks = [];
[-9.4, -6.0, -2.6].forEach((cx, i) => {
  const W = 3.1, D = 1.3, H = 1.7, cz = -4.9, baseH = 0.55, WL = H - 0.22;
  add(new THREE.BoxGeometry(W + 0.1, baseH, D + 0.1), steel, cx, baseH / 2, cz);
  add(new THREE.BoxGeometry(W + 0.12, 0.03, 0.03), steelEdge, cx, baseH, cz + D / 2 + 0.05, scene, false);
  add(new THREE.BoxGeometry(W - 0.1, 0.12, D - 0.1), toon(0xe6e2d4), cx, baseH + 0.06, cz, scene, false);
  for (let k = 0; k < 7; k++) add(new THREE.DodecahedronGeometry(0.05 + rnd() * 0.05, 0), toon(0xb9c2c4), cx - 1.3 + rnd() * 2.6, baseH + 0.13, cz - 0.4 + rnd() * 0.5, scene, false);
  for (let k = 0; k < 3; k++) {
    const sx = cx - 1.1 + k * 1.1 + rnd() * 0.3;
    for (let j = 0; j < 3; j++) { const c = add(new THREE.ConeGeometry(0.05, 0.45 + rnd() * 0.35, 5), toon(0x86c4b2), sx + j * 0.07, baseH + 0.38, cz - 0.4 + rnd() * 0.15, scene, false); c.rotation.z = (rnd() - 0.5) * 0.4; }
  }
  // 水体 + 明显的水位线
  add(new THREE.BoxGeometry(W - 0.06, WL, D - 0.06), waterMat, cx, baseH + WL / 2, cz, scene, false);
  add(new THREE.PlaneGeometry(W - 0.06, D - 0.06).rotateX(-Math.PI / 2), waterTopMat, cx, baseH + WL, cz, scene, false);
  add(new THREE.BoxGeometry(W - 0.06, 0.018, 0.01), waterLineMat, cx, baseH + WL, cz + D / 2 - 0.025, scene, false);
  // 薄玻璃 + 克制的亮线
  add(new THREE.BoxGeometry(W, H, D), glassMat, cx, baseH + H / 2, cz, scene, false);
  for (const [ox, w] of [[-0.9, 0.06], [-0.75, 0.025]]) { const l = add(new THREE.PlaneGeometry(w, 1.2), glassLineMat, cx + ox, baseH + 0.9, cz + D / 2 + 0.006, scene, false); l.rotation.z = -0.5; }
  const e = 0.03;
  for (const [sx, sy, sz, px, py, pz] of [
    [W, e, e, 0, 0, D / 2], [W, e, e, 0, 0, -D / 2], [W, e, e, 0, H, D / 2], [W, e, e, 0, H, -D / 2],
    [e, e, D, W / 2, 0, 0], [e, e, D, -W / 2, 0, 0], [e, e, D, W / 2, H, 0], [e, e, D, -W / 2, H, 0],
    [e, H, e, W / 2, H / 2, D / 2], [e, H, e, -W / 2, H / 2, D / 2], [e, H, e, W / 2, H / 2, -D / 2], [e, H, e, -W / 2, H / 2, -D / 2]]) {
    add(new THREE.BoxGeometry(sx, sy, sz), steel, cx + px, baseH + py, cz + pz, scene, false);
  }
  add(new THREE.BoxGeometry(W + 0.12, 0.08, D + 0.12), toon(P.deep), cx, baseH + H + 0.04, cz);
  contact(cx, cz + 0.15, W + 0.8, D + 0.6);
  const tank = { cx, cz, W, D, y0: baseH + 0.32, y1: baseH + WL - 0.25, fish: [], bubbles: [] };
  for (let k = 0; k < 4; k++) {

    f.p = new THREE.Vector3(cx + (rnd() - 0.5) * 2, rand(tank.y0, tank.y1), cz + (rnd() - 0.5) * 0.5);
    f.target = f.p.clone(); f.heading = rnd() * Math.PI * 2; f.speed = rand(0.18, 0.42); f.turn = rand(0.9, 1.6);
    f.ph = rnd() * 10; f.tailSp = rand(4, 6.5); f.pause = 0;
    f.g.position.copy(f.p); tank.fish.push(f);

    tank.bubbles.push(b);

  add(new THREE.CylinderGeometry(0.06, 0.06, 0.08, 10), toon(P.deep), cx + W / 2 - 0.4, baseH + 0.16, cz - 0.3, scene, false);
  tanks.push(tank);
});

/* ================= NFC 鱼形立牌（独立于水缸） ================= */
function fishShape(w, h) {
  const s = new THREE.Shape();
  s.moveTo(w * 0.5, 0);
  s.bezierCurveTo(w * 0.42, h * 0.55, w * 0.0, h * 0.62, -w * 0.25, h * 0.2);
  s.lineTo(-w * 0.5, h * 0.5);
  s.quadraticCurveTo(-w * 0.42, 0, -w * 0.5, -h * 0.5);
  s.lineTo(-w * 0.25, -h * 0.2);
  s.bezierCurveTo(w * 0.0, -h * 0.62, w * 0.42, -h * 0.55, w * 0.5, 0);
  return s;

// 两段手臂 IK：让手准确落在世界坐标目标点上；pole 决定手肘朝向
const _v = new THREE.Vector3(), _ax = new THREE.Vector3(), _q = new THREE.Quaternion();
function reachArm(p, i, worldTarget, pole) {
  p.g.updateMatrixWorld(true);
  const t = p.g.worldToLocal(_v.copy(worldTarget)).sub(p.arms[i].position);
  const dir = t.clone().normalize();
  const d = clamp(t.length(), 0.08, L1 + L2 - 0.003);
  const a1 = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  _ax.crossVectors(dir, pole).normalize();
  const upper = dir.clone().applyAxisAngle(_ax, a1);
  const elbowPos = upper.clone().multiplyScalar(L1);
  const fore = dir.clone().multiplyScalar(d).sub(elbowPos).normalize();
  p.arms[i].quaternion.setFromUnitVectors(DOWN, upper);
  _q.copy(p.arms[i].quaternion).invert();
  p.elbows[i].quaternion.setFromUnitVectors(DOWN, fore.applyQuaternion(_q));
}

      const u = b.userData;
      b.position.y += u.sp * dt;
      b.position.x = u.ox + Math.sin(time * 2.2 + u.ph) * 0.04;
      b.position.z = u.oz;
      if (b.position.y > u.top) b.position.y = t.y0 - 0.2 - Math.random() * 0.3;
    }
  }

  // 冷雾
  for (const m of mists) {
    const u = m.userData; u.ph = (u.ph + dt * u.sp) % 1;
    m.position.set(u.x + u.ph * 0.35, C.h + 0.28 + u.ph * 0.35, u.z);
    m.material.opacity = Math.sin(u.ph * Math.PI) * 0.18;
    m.scale.setScalar(u.sz * (0.8 + u.ph * 0.4));
  }

  // NFC 环：慢呼吸，亮度变化为主
  standees.forEach((s, i) => {
    s.flash = Math.max(0, s.flash - dt * 1.2);
    const br = 0.5 + 0.5 * Math.sin(time * 1.6 + i * 1.7);
    s.ringMat.color.set(P.ring).multiplyScalar(0.82 + br * 0.18 + s.flash * 0.15);
    s.haloMat.opacity = 0.16 + br * 0.2 + s.flash * 0.35;
  });

  // —— 孩子 A：双手捧着设备，伸手轻触感应盘（停顿后收回）——
  const p = (time % CYCLE) / CYCLE;
  const reach = smooth(0.06, 0.24, p) * (1 - smooth(0.52, 0.66, p));
  kidA.g.updateMatrixWorld(true);
  restA.set(0, 1.05, 0.36); kidA.g.localToWorld(restA);
  touchA.copy(target.disc).add(new THREE.Vector3(0, 0.0, 0.11));
  cA.lerpVectors(restA, touchA, reach);
  holdDevice(kidA, devA, cA, 0, -0.15 * (1 - reach));     // 屏幕朝向孩子，背面贴向立牌
  kidA.head.rotation.x = 0.28 + reach * 0.08;
  kidA.g.position.z = target.disc.z + 0.47 - reach * 0.03;
  if (p > 0.235 && p < 0.25 && target.flash < 0.5) target.flash = 1;
  if (p > 0.26 && p < 0.42) {
    devA.g.getWorldPosition(pA); pA.y += 0.96 * DEV_S + 0.12;
    const k = smooth(0.26, 0.42, p);
    catchSprite.visible = true;
    catchSprite.position.lerpVectors(target.disc, pA, k); catchSprite.position.z += 0.12; catchSprite.position.y += Math.sin(k * Math.PI) * 0.25;
    catchSprite.scale.setScalar(0.4 * (1 - k * 0.5));
  } else catchSprite.visible = false;
  screenA.flash = (p > 0.4 && p < 0.92) ? 1 : 0;
  screenA.partner = (p > 0.6 && p < 0.92) ? 1 : 0;
  screenB.flash = (p > 0.64 && p < 0.92) ? 1 : 0;
  screenB.partner = screenB.flash;

  // —— 孩子 B：举起设备凑向 A 的设备（双人模式）——
  const lean = smooth(0.48, 0.6, p) * (1 - smooth(0.86, 0.96, p));
  kidB.g.updateMatrixWorld(true);
  const bRest = new THREE.Vector3(0.0, 1.06, 0.34); kidB.g.localToWorld(bRest);
  const bLean = new THREE.Vector3(0.05, 1.14, 0.46); kidB.g.localToWorld(bLean);
  cB.lerpVectors(bRest, bLean, lean);
  holdDevice(kidB, devB, cB, kidB.g.rotation.y + Math.PI, -0.12 - lean * 0.15);
  kidB.g.position.y = lean > 0.95 ? Math.abs(Math.sin(time * 7)) * 0.04 : 0;
  kidB.head.rotation.x = 0.22;
  kidB.head.rotation.y = -0.25 * lean;

  // 双人连线：两台设备之间的光点
  devA.g.getWorldPosition(pA); pA.y += 0.96 * DEV_S;
  devB.g.getWorldPosition(pB); pB.y += 0.96 * DEV_S;
  const linkOn = p > 0.6 && p < 0.88;
  linkSparks.forEach((s, i) => {
    s.visible = linkOn; if (!linkOn) return;
    const u = ((i / linkSparks.length) + time * 0.6) % 1;
    s.position.lerpVectors(pA, pB, u); s.position.y += Math.sin(u * Math.PI) * 0.22;
    s.material.opacity = Math.sin(u * Math.PI) * 0.8 * smooth(0.6, 0.65, p) * (1 - smooth(0.83, 0.88, p));
    s.scale.setScalar(0.13 + 0.04 * Math.sin(time * 5 + i));
  });

  // 成人与鱼贩
  parent.head.rotation.y = Math.sin(time * 0.4) * 0.15;
  worker.arms[0].rotation.x = -0.7 + Math.sin(time * 1.6) * 0.18; worker.arms[1].rotation.x = -0.6 + Math.cos(time * 1.3) * 0.15;
  worker.elbows[0].rotation.x = worker.elbows[1].rotation.x = -0.9;
  worker.head.rotation.x = 0.3;
  worker2.arms[1].rotation.x = -0.6 + Math.sin(time * 1.1 + 1) * 0.2; worker2.elbows[1].rotation.x = -0.8;
  worker2.head.rotation.y = Math.sin(time * 0.45) * 0.35;

  // FishPal：屏幕、触手、展示模型慢速自转
  screenShow.draw(time); screenA.draw(time); screenB.draw(time + 0.37);
  for (const pal of pals) pal.tentacles.forEach((tt, i) => { tt.rotation.x = Math.sin(time * 1.2 + i) * 0.08; tt.rotation.z = Math.cos(time * 1.0 + i * 1.3) * 0.07; });
  hero.g.rotation.y = Math.sin(time * 0.12) * 1.1 + time * 0.12;
  hero.g.position.y = 0.25 + (1 + Math.sin(time * 0.9)) * 0.03;
  giant.g.position.y = 0.32 + (1 + Math.sin(time * 1.1)) * 0.02;

  controls.update();
  effect.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
